[project]
name = "linercad"
version = "0.1.0.dev0"
description = "Liner-CAD: a generic 2D engineering-drawing harness for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4,<2",
]

[project.scripts]
lcad = "linercad.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
