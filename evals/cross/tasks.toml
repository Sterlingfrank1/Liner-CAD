# Cross-agent evaluation tasks (SPEC M3 §1.8). Same text for every agent and for the baseline.

[[task]]
id = "box"
kind = "part"
first = """画一张减速器箱盖的零件图（箱体类，A3，1:1，材料 HT200）。
形状：底板 160×110，厚 10；底板四角各一个 Φ11 通孔，孔中心距底板边缘 10。底板上方是一个空心箱体，外形 110×70，总高 55（从底板底面算起），壁厚 5，底部敞口（内腔从底面一直到顶板下面）。顶板中央有一个圆柱凸台 Φ46，高出顶板 12；凸台中心有贯通的轴承孔 Φ28H7（一直通到内腔）。
要求：主视图沿前后对称面全剖，另有俯视图和左视图；标注全部定形、定位尺寸，轴承孔注公差 H7 并标粗糙度 Ra1.6，其余表面 Ra12.5；写上未注尺寸公差和技术要求（未注铸造圆角 R3~R5、时效处理）。"""
rounds = [
  "轴承孔改成 Φ30H7，凸台跟着改成 Φ50。",
  "加形位公差：轴承孔轴线对底板底面的垂直度 0.03，底面作基准 A。",
  "技术要求再加一条：未注倒角 C1。",
]

[[task]]
id = "fork"
kind = "part"
first = """画一张托架的零件图（叉架类，A3，1:1，材料 HT150）。
形状：底板 100×60，厚 12，底板上两个 Φ12 安装通孔，孔中心距左右端各 15、在前后方向居中。底板后边缘立一块竖板，竖板宽 100（与底板同宽）、厚 12、从底板底面算起高 70。竖板顶部有一个水平轴线的圆筒，外径 Φ40、内孔 Φ22H7，圆筒轴线沿前后方向（垂直于竖板），圆筒长 50（从竖板背面向前伸出），轴线距底板底面 70，左右居中。竖板与底板之间、左右居中有一块三角形肋板，厚 8。
要求：主、俯、左三视图（必要时加局部剖或断面），标全尺寸，Φ22H7 孔标粗糙度 Ra1.6 并以其轴线为基准 A 注竖板前面对 A 的垂直度 0.05；未注尺寸公差、未注铸造圆角 R3。"""
rounds = [
  "圆筒内孔改成 Φ25H7。",
  "底板的两个安装孔改成 Φ14，并把它们的定位尺寸放到俯视图下方。",
  "标题栏图号填 TJ-02，设计人填 eval。",
]

[[task]]
id = "asm"
kind = "assembly"
first = """画一张简单的轴承座装配图（A3，1:1）。零件：
1 底座：长方体 120×60×30（长×宽×高），中央有竖直通孔 Φ30；两端各有一个竖直 Φ11 通孔，孔中心距中心 45。材料 HT200。
2 轴套：外径 Φ30、内径 Φ20、长 36，装在底座中孔里，底面与底座底面齐平（上端伸出 6）。材料 ZCuSn10Pb1。
3 轴：Φ20，长 80，穿过轴套，下端低于底座底面 10。材料 45。
4 螺栓 GB/T 5782 M10×40，2 个，从底座上方穿入两端孔（头部在上面）。
5 螺母 GB/T 6170 M10，2 个，拧在螺栓下端、贴在底座底面下方……若无法真实装配可只画螺栓。
要求：主视图沿前后对称面全剖（轴、螺栓按不剖处理），俯视图外形；零件序号、明细栏（序号、代号、名称、数量、材料）；标注总长、总高、两螺栓孔中心距 90 和轴套与底座的配合 Φ30H7/k6。"""
rounds = [
  "两螺栓孔中心距改成 100（底座长度不变）。",
  "明细栏里轴的材料改成 40Cr。",
  "主视图的配合尺寸挪到视图上方。",
]
