# E7 demo tasks (run_demo.py trial scenarios) merged into cross_agent.py.

[[task]]
id = "tool"
kind = "part"
first = """请参照模板文件 ./template/牛鼻铣刀.dxf（企业图框、标题栏、尺寸参数表和图面风格；这是一张 Φ4 牛鼻铣刀的现成图纸）的样式，画一张新规格牛鼻立铣刀的零件图（A3）。尺寸你按合理值定：
刀径 D=8，颈径 D1=7.6，角半径 R=1，刃长 L1=20，有效长度 L2=45（从刀尖算起），柄径 d=8（h6，注 0/-0.009），总长 L=100，3 刃，螺旋角 45°；材料硬质合金，极光涂层，加工材质铝。
图面要求：刀具竖放、刀尖朝下，与模板一致的表达（刃部用剖面线表示并引出“刃部”、标 R 和 D）；右下角标题栏名称“3F极光涂层铝用牛鼻刀”，图号 D8R1-20-D8-100-M45-W-45°-A；右侧放尺寸参数表（D、D1、R、L1、L2、d、L、涂层）；技术要求同模板：1.加工材质：铝；2.刃数：3刃；3.材料：硬质合金；4.螺旋角度：45°；5.未注尺寸公差按照 GB/T 1804-M；6.未注形位公差按照 GB/T 1184-K。"""
rounds = [
  """把刀具直径 D 改成 10（其余尺寸按比例/合理值调整），保留原图其余表达。""",
  """把柄径 d 的公差由 h6 改成 h5，并同步更新尺寸参数表。""",
  """在技术要求中增加一条：未注倒角 C0.2。""",
]

[[task]]
id = "motor"
kind = "part"
first = """这张图没有现成模板，请自行设计图面：画一张 Y90S-4 三相异步电动机的外形及安装尺寸图（B3 卧式底脚安装，A3，比例自选，材料不用写）。尺寸（mm，参考 GB/T 4772.1，你可微调到合理）：
机座中心高 H=90；底脚孔中心距 A=140（宽度方向）、B=100（轴向）；轴伸端面到最近底脚孔中心 C=56；底脚孔 4×Φ10；底脚总宽 AB=180；机座外圆 Φ175 带散热筋；接线盒在机座顶部，轴线到接线盒顶 AD=155；总高 HD=190（含接线盒）；轴伸 D=Φ24j6、长 E=50，平键 8×7（键槽宽 F=8，键槽深度 GA=27）；总长 L=310（含轴伸）；前端盖（轴伸端）、后端盖带风扇罩、尾部风罩，机座上有铭牌位置。
要求：主视图（轴线水平，从电机侧面看，显示底脚、机座、端盖、风罩、接线盒、轴伸与键槽）、左视图（从轴伸端看，显示端盖、止口、轴伸、键、底脚孔），必要时加俯视图或局部剖显示底脚孔；标全外形尺寸 L/HD/AB/AC、安装尺寸 A/B/C/H、轴伸尺寸 D/E/F/GA，轴伸 Φ24j6 注粗糙度 Ra1.6；右侧放铭牌参数表（型号 Y90S-4、功率 1.1 kW、电压 380 V、转速 1400 r/min、防护等级 IP44、安装方式 B3、绝缘 B 级）；技术要求：1.外形及安装尺寸按 GB/T 4772.1；2.未注尺寸公差按 GB/T 1804-m；3.涂漆：外表面蓝灰色；标题栏：名称“Y90S-4 三相异步电动机外形及安装尺寸图”，图号 Y90S4-WX-01。"""
rounds = [
  """把底脚孔中心距 A 改为 150，B 改为 110。""",
  """把轴伸直径 D 改为 Φ28j6，键槽相应调整。""",
  """在铭牌参数表把转速改为 1450 r/min。""",
]

