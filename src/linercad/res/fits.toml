# Fits and tolerances for sizes up to 500 mm. Values in micrometres (unit = "um"); res.fit() returns mm.
# Sizes are matched "over a, up to and including b" (30 falls in the 18-30 range).
[meta]
std = "GB/T 1800.1-2020"
iso = "ISO 286-1:2010"
limits_std = "GB/T 1800.2-2020"
limits_iso = "ISO 286-2:2010"
unit = "um"
source = """IT1-IT18 (all 13 ranges): matched cell by cell against a textbook table of GB/T 1800.1 (Tsinghua Univ. Press, Gong Cha Pei He Yu Ce Liang, 3rd ed., table 2.2, tup.tsinghua.edu.cn/upload/books/yz/067730-03.pdf) and, for IT1-IT14 (ranges over 1 mm), against roymech.co.uk/Useful_Tables/ISO_Tolerances/ISO_Tol_T.htm. Shaft fundamental deviations a b c d e f g k m n p r s t u (25 sub-ranges): matched against roymech.co.uk/Useful_Tables/ISO_Tolerances/ISO_SHAFT_LIM_1.html; d e f g k m n p r and a also against github.com/pgreene16/isofits util/iso_shafts.csv (3-400 mm). Hole deviations are derived in code (ISO 286-1 general and special rule); the derived ES of K7, P6, P7, R7, S7, T7, U7 match roymech.co.uk/Useful_Tables/ISO_Tolerances/ISO_Hole_LIM_1.html in all 25 ranges (its M and N columns are garbled or differ at 0-3 mm, so M and N rest on the rule and on known values such as M7 = 0, N7 at 18-30 mm = -7)."""

