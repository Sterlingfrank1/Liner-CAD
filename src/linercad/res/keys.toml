# Parallel keys and keyways, shaft diameters over 6 up to 130 mm. Lengths in mm.
# d over `over` up to and including `upto`; tol = deviation of t1 and t2 (+tol / 0).
key = [
  { over = 6, upto = 8, b = 2, h = 2, t1 = 1.2, t2 = 1.0, tol = 0.1 },
  { over = 8, upto = 10, b = 3, h = 3, t1 = 1.8, t2 = 1.4, tol = 0.1 },
  { over = 10, upto = 12, b = 4, h = 4, t1 = 2.5, t2 = 1.8, tol = 0.1 },
  { over = 12, upto = 17, b = 5, h = 5, t1 = 3.0, t2 = 2.3, tol = 0.1 },
  { over = 17, upto = 22, b = 6, h = 6, t1 = 3.5, t2 = 2.8, tol = 0.1 },
  { over = 22, upto = 30, b = 8, h = 7, t1 = 4.0, t2 = 3.3, tol = 0.2 },
  { over = 30, upto = 38, b = 10, h = 8, t1 = 5.0, t2 = 3.3, tol = 0.2 },
  { over = 38, upto = 44, b = 12, h = 8, t1 = 5.0, t2 = 3.3, tol = 0.2 },
  { over = 44, upto = 50, b = 14, h = 9, t1 = 5.5, t2 = 3.8, tol = 0.2 },
  { over = 50, upto = 58, b = 16, h = 10, t1 = 6.0, t2 = 4.3, tol = 0.2 },
  { over = 58, upto = 65, b = 18, h = 11, t1 = 7.0, t2 = 4.4, tol = 0.2 },
  { over = 65, upto = 75, b = 20, h = 12, t1 = 7.5, t2 = 4.9, tol = 0.2 },
  { over = 75, upto = 85, b = 22, h = 14, t1 = 9.0, t2 = 5.4, tol = 0.2 },
  { over = 85, upto = 95, b = 25, h = 14, t1 = 9.0, t2 = 5.4, tol = 0.2 },
  { over = 95, upto = 110, b = 28, h = 16, t1 = 10.0, t2 = 6.4, tol = 0.2 },
  { over = 110, upto = 130, b = 32, h = 18, t1 = 11.0, t2 = 7.4, tol = 0.2 },
]

[meta]
std = "GB/T 1095-2003"
key_std = "GB/T 1096-2003"
iso = "ISO 773 / ISO 2491"
unit = "mm"
source = """b, h, t1, t2 for d over 6 up to 130 mm: matched row by row against fasten.it/en/norms/norm/din_6885-1 (DIN 6885-1, all 26 rows up to 500 mm), \
aimsindustrial.com.au/blogs/product-guides/keyway-guide (ISO 773) and a Maryland Metrics key table (mdmetric.com, PDF at eclass.upatras.gr). Rows above 130 mm (36x20 ... 100x50) are not recorded because their depth tolerance group is not verified. \
Depth deviation tol (t1 and t2 are +tol/0): +0.1/0 for 2x2 to 6x6, +0.2/0 for 8x7 to 32x18 (+0.3/0 from 36x20, not recorded here). Read on 2026-11-10 from the GB/T 1095-2003 keyway cross-section table as reproduced by www.164580.com/info_416738.html (groups taken from the table's merged cells), \
in agreement with the JIS B 1301-1996 table (mikipulley.co.jp/en/resources/parallel-key-and-keyway-dimensions-and-tolerances, same as ISO 773). The 164580 page prints t1 = 5 for 14x9, a typo: the other three sources give 5.5, and t1 + t2 = h + 0.3 holds for every neighbouring row with 4 <= h <= 10; 5.5 is kept. \
GB/T 1095-2003 itself was not read, only that web reproduction. The shaft-diameter ranges (d over / up to) are not on that page; they stay from DIN 6885-1 / ISO 773. \
The (d - t1) dimension takes the sign-reversed deviation of t1 and (d + t2) the deviation of t2 (the convention of the standard; the 164580 page has no note on it, so still not seen). \
Key width fits normal (N9 shaft, JS9 hub) and close (P9, P9): on the 164580 page (GB/T 1095-2003) and in JIS B 1301-1996. Its loose fit (H9 shaft, D10 hub) is not recorded. \
Key length series: the part common with DIN 6885-1 (fasten.it) up to 280 mm; the GB/T 1096-2003 series above 280 mm was not verified."""

[width_fit.normal]
shaft = "N9"
hub = "JS9"

[width_fit.close]
shaft = "P9"
hub = "P9"

[length_series]
values = [6, 8, 10, 12, 14, 16, 18, 20, 22, 25, 28, 32, 36, 40, 45, 50, 56, 63, 70, 80, 90, 100, 110, 125, 140, 160, 180, 200, 220, 250, 280]
