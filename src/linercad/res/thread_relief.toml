[meta]
std = "GB/T 3-1997"
iso = "ISO 3508:1976 (external run-outs), ISO 4755:1983 (external undercuts); no ISO for internal threads"
unit = "mm"
verified = { ext_runout = true, ext_undercut = true, int_runout = false, int_undercut = false }
source = """Tables 1-4 of GB/T 3-1997 as printed on the YJT fastener database page www.164580.com/info_369512.html (read 2026-11-09, parsed from the HTML table structure); the standard itself was not read. \
External tables checked cell by cell against the same database's pages for ISO 4755:1983 (www.164580.com/info_65331.html, all 23 undercut rows) and ISO 3508:1976 (www.164580.com/info_65280.html, all 24 run-out rows); they agree, \
except that the GB/T 3 page prints x = 1.3 for P = 1.75, a transcription error: ISO 3508 gives 4.3 (about 2.5P), which is recorded. \
Internal-thread tables (run-out, undercut) have a single source (the GB/T 3 page; ISO 3508 / 4755 cover external threads only), so they are marked unverified here; they follow the standard's own rules (X = 4P, short X = 2P, G1 = 4P, short G1 = 2P, Dg = D + 0.3 up to P = 0.8 and D + 0.5 from P = 1). \
The internal run-out table header reads run-out X (normal / short) and shoulder A (normal / long); the Dg cell is merged over P = 0.5-0.8 and P = 1-6 on the page and was filled from that merge."""

[tol]
ext_dg = "h13"        # tolerance of dg for d > 3 mm
ext_dg_small = "h12"  # for d <= 3 mm
ext_dg_over = 3
int_Dg = "H13"
min_transition_angle = 30  # deg, GB/T 3 clause 1.2

