# Grinding wheel relief grooves for turned surfaces and end faces: widths b1 and b2, depth h and radius r,
# in mm. A row is usable for workpiece diameters d over `over` up to and including `upto` (no `upto` =
# unlimited); a bigger workpiece may take a smaller groove of the table.
groove = [
  { over = 0, upto = 10, b1 = 0.6, b2 = 2.0, h = 0.1, r = 0.2 },
  { over = 0, upto = 10, b1 = 1.0, b2 = 3.0, h = 0.2, r = 0.5 },
  { over = 0, upto = 10, b1 = 1.6, b2 = 3.0, h = 0.2, r = 0.5 },
  { over = 10, upto = 50, b1 = 2.0, b2 = 4.0, h = 0.3, r = 0.8 },
  { over = 10, upto = 50, b1 = 3.0, b2 = 4.0, h = 0.4, r = 1.0 },
  { over = 50, upto = 100, b1 = 4.0, b2 = 5.0, h = 0.4, r = 1.0 },
  { over = 50, upto = 100, b1 = 5.0, b2 = 5.0, h = 0.6, r = 1.6 },
  { over = 100, b1 = 8.0, b2 = 8.0, h = 0.8, r = 2.0 },
  { over = 100, b1 = 10.0, b2 = 10.0, h = 1.2, r = 3.0 },
]

[meta]
std = "GB/T 6403.5-2008"
unit = "mm"
verified = false
source = """NOT VERIFIED against the standard. The table for turned surfaces and end faces of GB/T 6403.5-1986, as printed in the Jialichuang FA mechanical design handbook (www.jlc-jdgf.com/mcbook/1-5-15.htm, read 2026-11-09, \
parsed from the HTML table: each of b1 / b2 / h / r is a row of column spans, mapped onto the d bands ~10, >10~50, >50~100, >100) and reprinted at www.ml21.com/1302.html (same values: one lineage, not two independent sources). \
The 2008 revision replaces the 1986 edition and its text could not be read (bzxz.net only lists it behind a download), so the 2008 values are assumed unchanged. \
Only the rule printed under the table is checked here: r < 3h. The other tables of the standard (guide rails, flat and V-shaped wheels) are not recorded."""
