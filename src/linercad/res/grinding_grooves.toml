# Grinding wheel relief grooves for turned surfaces and end faces: widths b1 and b2, depth h and radius r,
# in mm. A row is usable for workpiece diameters d over `over` up to and including `upto` (no `upto` =
# unlimited); a bigger workpiece may take a smaller groove of the table.
groove = [
  { over = 0, upto = 10, b1 = 0.6, b2 = 2.0, h = 0.1, r = 0.2 },
  { over = 0, upto = 10, b1 = 1.0, b2 = 3.0, h = 0.2, r = 0.5 },
  { over = 0, upto = 10, b1 = 1.6, b2 = 3.0, h = 0.2, r = 0.5 },
  { over = 10, upto = 50, b1 = 2.0, b2 = 4.0, h = 0.3, r = 0.8 },
  { over = 10, upto = 50, b1 = 3.0, b2 = 4.0, h = 0.4, r = 1.0 },
  { over = 50, upto = 100, b1 = 4.0, b2 = 5.0, h = 0.4, r = 1.0 },
  { over = 50, upto = 100, b1 = 5.0, b2 = 5.0, h = 0.6, r = 1.6 },
  { over = 100, b1 = 8.0, b2 = 8.0, h = 0.8, r = 2.0 },
  { over = 100, b1 = 10.0, b2 = 10.0, h = 1.2, r = 3.0 },
]

[meta]
std = "GB/T 6403.5-2008"
unit = "mm"
verified = true
source = """Table 1 (回转面及端面砂轮越程槽的尺寸) of GB/T 6403.5-2008, read 2026-11-21 from the copy at Liner-CAD-refs/2026-11-09-res-gaps/standards-preview/GBT-6403_5-2008.pdf (5 pages, not committed). \
The text layer gives the cell values; the rendered page shows the merged cells the text layer loses (b2, h and r each span two b1 columns; d spans three columns in the ~10 band and two in the others). \
Every cell of b1, b2, h, r and every d band matches this file. The last d cell prints "100" in this copy - the "＞" is missing from both its text layer and its rendering - and is read as >100, which is what the 1986 edition printed and what the band sequence implies, so d = 100 stays in the 50~100 band. \
The 1986 table as reprinted by the Jialichuang handbook (www.jlc-jdgf.com/mcbook/1-5-15.htm, read 2026-11-09) and at www.ml21.com/1302.html agrees with the 2008 table in every cell. \
The note under the table reads r <= 3h. The other tables of the standard (2 平面, 3 V形, 4 燕尾导轨, 5 矩形导轨) are not recorded."""
