# Rule catalog (E2, benchmark-metrics §5.2/§6): every rule checks.run can report.
#
# Fields: id / pack / family / fn / statement / std / clause / clause_status / status /
# positive / negative. clause_status:
#   read    - the clause / table number was read from the standard text (see read_sources)
#   design  - the rule's authority is this repository's DESIGN.md, quoted as DESIGN §x.y
#   pending - only the standard number is known; the clause number has NOT been read and is
#             never invented (clause == std for these rows)
# The mutation framework (evals/mutate.py) keeps these rows honest: every done rule has one
# operator, detection 1.0 and no false positives on the reference drawings (known debt aside).

[meta]
purpose = "每条规则的度量目录：id、标准、条款、陈述、实现函数、状态、正/反例 fixture"
clause_policy = "read 保留读到的条款/表号；design 引 DESIGN 节；pending 只写标准号、不编造条款号"
read_sources = "GB/T 1182-2018、GB/T 17851-2010 由 A4（card #93）逐页读入 res/gtol.toml 与 res/datum.toml；其余标准的原文未在本仓库读到"
known_debt = "参考图上的 E5 排布债务 + 径向引线交叉现存违规，冻结在 evals/known-debt.json，变异框架计为真阳性"
mutation = "evals/mutate.py：35 条 done 规则各一个变异算子；检出率 1.0、参考图误报 0（已知债务除外）"

