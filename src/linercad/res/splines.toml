[meta]
std = "GB/T 1144-2001"
iso = "ISO 14:1982"
unit = "mm"
source = """N x d x D x B rows: 15 light and 20 medium, matched against the ISO 14 table reproduced at tehnikmesinindustri.blogspot.com/2012/01/straight-sided-spline-dimensions.html. \
That page prints the medium 8x56 row as 8x56x66 in the designation but D = 65 in the column; 65 is recorded (the progression of D - d agrees, and it is the ISO 14 value). \
Tolerance classes: the page lists hole H7, H9, H10, H11 and shaft d10, a11, f7, f9, g7, h7, h10 for the sliding, close (sliding) and fixed fits; \
which class belongs to which fit follows GB/T 1144-2001 as given in the card (hole d H7, D H10, B H9 or H11 after heat treatment; sliding f7/a11/d10, close g7/a11/f9, fixed h7/a11/h10), not read from a fetched page. Precision-grade classes are not recorded."""

[tol.hole]
d = "H7"
D = "H10"
B = ["H9", "H11"]

[tol.shaft.sliding]
d = "f7"
D = "a11"
B = "d10"

[tol.shaft.close]
d = "g7"
D = "a11"
B = "f9"

[tol.shaft.fixed]
d = "h7"
D = "a11"
B = "h10"
