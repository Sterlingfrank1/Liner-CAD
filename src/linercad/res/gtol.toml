# Geometric-tolerance characteristics, GB/T 1182-2018 (card A4).
#
# 19 entries = table 1 "几何特征符号" of GB/T 1182-2018, in its order: 6 form, 5 orientation,
# 6 location and 2 run-out specifications. Position is one entry (table 1 has two datum rows for
# it); profile of a line / of a surface appears once per specification category, as in table 1.
# Every entry carries its table-1 subclause; the orientation profile rows have no subclause in
# table 1 and point to the definitions of 17.6 / 17.7 plus B.10.3.
[meta]
std = "GB/T 1182-2018"
iso = "ISO 1101:2017"
related = ["GB/T 17851-2010", "GB/T 17852-2018"]
verified = false
source = """Read page by page from the PDF copies supplied by the user in Liner-CAD-refs/2026-11-09-res-gaps/standards-preview/ (GBT-1182-2018-产品几何技术规范（GPS）.pdf, 132 pages; GBT 17851-2010 ...pdf, 17 pages; GBT-17852-2018-...pdf, 40 pages), converted to page images and read with the vision model on 2026-11-21. \
clause, category, datum requirement and subclause come from GB/T 1182-2018 table 1 (printed page 5); allowed measured elements, tolerance-zone shapes and modifiers come from the definitions in 17.2-17.17 (printed pages 51-90), the default/specification-element clauses 7.1-7.4 and 8.2.3.1.1-8.2.3.1.4.3 (printed pages 11-19) and annex B.8-B.10 (printed pages 99-102), with GB/T 17852-2018 5.2.3 for the profile zones. \
The standard itself was read, but only one copy/lineage is available to this card and several clauses were not read (see unread), so the file keeps verified = false: do not treat a row as fully checked against the standard."""
unread = """GB/T 1182-2018: the footnote under table 1 for the no-datum Position row (its subclause cell is printed as "b"; the footnote text was not found on the scanned pages); chapter 9 附加标注 (9.1.2 全周/全表面, 9.1.3 局部区域, 9.1.4 区间符号); chapter 10 TED; chapter 11 局部规范; chapters 12-16 (延伸被测要素, 相交平面, 定向平面, 方向要素, 组合平面); annexes A, C, D, E and F in full; pages 25-27 and 30-32 of clause 8 (filter / association details, characteristic parameters). \
GB/T 17851-2010: clauses 4 and 5 read only in part (table 1 read; the text on establishing datums from a set of features was not), clause 7 基准目标 and clause 8 三基面体系 were not read; clause 6.2 is taken from the user-page image recorded in datum.toml. \
GB/T 17852-2018: 5.1, 5.2.1, 5.2.2 and 5.2.3 read; rules D-H of 5.2 and annexes A and B were not read. \
Other standards referenced but not read: GB/T 16671-2018 (maximum / minimum / reciprocity requirements M, L, R), ISO 10579:2010 (free state F), ISO 1101:2017 itself (GB/T 1182-2018 is a modified adoption whose technical differences are marked in the margins and were not analysed), GB/T 4249-2018 (principles), GB/T 13319-2020 (combined / united features)."""
pending = [
    "Position without a datum: table 1 prints subclause \"b\" - read the original footnote before E4 judges that case.",
    "Count: table 1 has 14 characteristic symbols, 20 specification rows and (with the two datum rows of Position merged) 19 entries; this file keeps the 19-entry reading. Confirm against the original if E4 needs 20.",
    "Material condition requirements M / L / R and free state F come from GB/T 16671-2018 and ISO 10579:2010 via 8.2.3.4 / 8.2.3.5 and table 3; those standards were not read, so they are described in [modifiers] but not listed per entry.",
    "The modifier lists per entry follow the definition clauses that were read (8.2.3.1, B.10); a per-feature applicability matrix for CZ / SZ / UZ / OZ / VA / ACS / UF was not extracted from the original.",
    "Annex B of GB/T 17852-2018 (16 profile examples) and chapter 9 of GB/T 1182-2018 (附加标注) were not read; see unread.",
]

[zone_shapes]
two_parallel_lines = "两平行直线之间的区域（17.2，相交平面内）"
two_parallel_planes = "两平行平面之间的区域（17.3、17.10-17.13、17.15、17.17）"
cylinder = "圆柱面内的区域；公差值前必须注 φ（7.4、17.2、17.10-17.13）"
sphere = "球面所限定的区域；公差值前注 Sφ（7.4、17.13.2）"
circle = "圆所限定的区域；公差值前注 φ（17.14.2）"
two_concentric_circles = "同一横截面内、半径差等于 t 的两同心圆之间（17.4、17.16.2）"
two_coaxial_cylinders = "半径差等于 t 的两同轴圆柱面之间（17.5、17.17.2）"
two_envelope_curves = "直径等于 t、圆心位于 TEF 上的一系列圆的两等距包络线之间（17.6、17.7）"
two_envelope_surfaces = "直径等于 t、球心位于 TEF 上的一系列球的两等距包络面之间（17.8、17.9）"
tube = "直径等于 t 的包络圆管（17852-2018 5.2.3，线轮廓度、φ、导出线）"
two_equal_circles = "轴向距离等于 t 的两个等直径圆之间（17.16.3）"
two_circles_on_cone = "沿素线方向间距等于 t 的两个不等圆之间（17.16.4、17.16.5）"

[targets]
line = "线要素：组成直线或导出直线（17.2、17.6、B.10.2）"
surface = "面要素：组成表面或导出表面（17.3、17.8、B.10.2）"
circle = "圆周线或一组圆周线，属组成要素（17.4、17.16.1）"
cylindrical_surface = "圆柱表面，属组成要素（17.5、17.17.1）"
point = "点要素（组成或导出点，17.13.1、17.15.1）"
plane = "平面要素（组成或导出，17.13.1、17.15.1）"
derived_point = "导出点：球的中心点 / 圆的中心点（17.14.1、17.14.2）"
derived_line = "导出直线：中心线 / 轴线（17.14.1、17.14.3）"

[modifiers]
CZ = "组合公差带；用于多个要素时（8.2.3.1.2）"
SZ = "独立公差带；用于多个要素、防止歧义时（8.2.3.1.2）"
UZ = "给定偏置量的偏置公差带；仅用于组成要素，与位置度组合时只用于平面要素（8.2.3.1.3）"
OZ = "未给定偏置量的线性偏置公差带；用于线/面轮廓度以表明 TEF 尺寸未固定（8.2.3.1.4.1）"
VA = "未给定偏置量的角度偏置公差带；用于角度可变的角度要素或圆锥（8.2.3.1.4.2）"
"><" = "仅约束方向，不约束平移（8.2.3.1.4.3、B.10.3）"
ACS = "任意横截面；仅当被测要素的导出要素是线要素时（B.10.6、8.4.2）"
UF = "联合要素（3.9、8.4.2）"
M = "最大实体要求（GB/T 16671-2018；经 8.2.3.4 与表 3 引用，本卡未读该标准）"
L = "最小实体要求（GB/T 16671-2018；同上）"
R = "可逆要求（GB/T 16671-2018；同上）"
F = "自由状态（ISO 10579:2010；经 8.2.3.5 与表 3 引用，本卡未读该标准）"

