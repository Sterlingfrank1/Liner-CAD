# Standard parts used by the M3 L3 assemblies (only these sizes). Lengths in mm.
# Shapes are simplified for assembly drawings: threads drawn at the major diameter.

[meta]
unit = "mm"
source = "GB/T 5782-2016, GB/T 6170-2015, GB/T 97.1-2002, GB/T 119.1-2000, GB/T 68-2016, GB/T 71-2018 tables (product grade A, nominal / max values)"

# 六角头螺栓：s 对边，k 头高，e 对角（A 级 min），b 螺纹长（l ≤ 125）
[bolt]
std = "GB/T 5782-2016"
iso = "ISO 4014:2011"
name = "六角头螺栓"
sizes = [
  { d = 6, s = 10, k = 4.0, e = 11.05, b = 18 },
  { d = 8, s = 13, k = 5.3, e = 14.38, b = 22 },
  { d = 10, s = 16, k = 6.4, e = 17.77, b = 26 },
  { d = 12, s = 18, k = 7.5, e = 20.03, b = 30 },
  { d = 16, s = 24, k = 10.0, e = 26.75, b = 38 },
]

