# Letters that must not be used as datum letters.
[ISO]
std = "ISO 5459:2011"
letters = ["I", "O", "Q", "X"]
verified = true
source = "Datum label rule of the PTC Creo Parametric model-based definition help for ISO datum labels (support.ptc.com/help/creo/creo_plus/usascii/model-based_definition/gdt_datum_label_invalid_2.html): may not include I, O, Q or X. A software rule, not the clause of ISO 5459 itself, which was not read."

[GB]
std = "GB/T 1182-2018"
letters = ["I", "O", "Q", "X"]
verified = false
source = "NOT VERIFIED. GB/T 1182-2018 and GB/T 17851-2010 could not be read; the ISO set is repeated because GB/T 1182-2018 is a modified adoption of ISO 1101:2017 / ISO 5459:2011. The older GB/T 1182-1996 is thought to have excluded more letters (E F I J L M O P R); not checked."
