# Letters recommended not to be used as datum letters (a recommendation in a note, not a prohibition).
[ISO]
std = "ISO 5459:2011"
letters = ["I", "O", "Q", "X"]
verified = false
source = "Datum label rule of the PTC Creo Parametric model-based definition help for ISO datum labels (support.ptc.com/help/creo/creo_plus/usascii/model-based_definition/gdt_datum_label_invalid_2.html): may not include I, O, Q or X. A software rule, not the clause of ISO 5459 itself, which was not read. GB/T 17851-2010 clause 6.2 note 2 gives the same set (see [GB]); how it corresponds to ISO 5459 was not checked."

[GB]
std = "GB/T 17851-2010"
clause = "6.2"
letters = ["I", "O", "Q", "X"]
verified = true
source = """GB/T 17851-2010 clause 6.2 (基准字母) note 2: 建议不要用字母 I, O, Q 和 X. Read from a page image supplied by the user on 2026-11-10. \
Card A4 re-checked the relationship to GB/T 1182-2018 clause by clause on the supplied standard PDFs (read 2026-11-21): GB/T 1182-2018 8.2.4 (基准部分) sends datum and datum-annotation information to GB/T 17851 (见 GB/T 17851) and its main text contains no list of letters; the 19 characteristic entries of its table 1 need no letter list. GB/T 17851-2010 6.3.2 gives the common-datum form A-B (letters separated by a short dash) and 6.3.3 gives the order rule (第三格到第五格 by priority: 第一基准 / 第二基准 / 第三基准; the order affects the actual control result). Those two subclauses were read from the supplied PDF pages (printed pages 8-9). Clause 6.2 itself was not re-read from the PDF (its text comes from the user page image). The longer list E F I J L M O P R thought to belong to GB/T 1182-1996 is not in this text and is not applied."""
