name = "GB"

# 标准档 GB（SPEC §6）。每组带 basis：标准号，或 convention（标准没给具体数值、取教材通行值或实测值）。

[lines]  # 线宽、颜色、线型。颜色为 ACI 色号
basis = "GB/T 4457.4-2002 线宽（粗:细 = 2:1，d=0.5 组；剖切符号 1~1.5d）；GB/T 14665-2012 图线颜色（与 GB/T 18229-2000 一致）"
thick   = { layer = "THICK",   width = 0.5,  color = 7, linetype = "CONTINUOUS" }
thin    = { layer = "THIN",    width = 0.25, color = 3, linetype = "CONTINUOUS" }
hidden  = { layer = "HIDDEN",  width = 0.25, color = 2, linetype = "LC_HIDDEN" }
center  = { layer = "CENTER",  width = 0.25, color = 1, linetype = "LC_CENTER" }
phantom = { layer = "PHANTOM", width = 0.25, color = 6, linetype = "LC_PHANTOM" }
dim     = { layer = "DIM",     width = 0.25, color = 3, linetype = "CONTINUOUS" }
text    = { layer = "TEXT",    width = 0.25, color = 3, linetype = "CONTINUOUS" }
hatch   = { layer = "HATCH",   width = 0.25, color = 3, linetype = "CONTINUOUS" }
section = { layer = "SECTION", width = 0.7,  color = 7, linetype = "CONTINUOUS" }

[linetypes]  # 图案元素（mm）：正数为画，负数为隔，0 为点
basis = "convention：GB/T 17450-1998 以线宽 d 的倍数给出（画 12d、隔 3d、长画 24d、点 ≤0.5d），按细线 d=0.25 过密；取教材通行值（虚线画长 2~6、间隔约 1；点画线长画 15~30、间隔约 3）"
LC_HIDDEN  = { pattern = [4.0, -1.0], description = "hidden __ __" }
LC_CENTER  = { pattern = [20.0, -3.0, 0.5, -3.0], description = "center ____ . ____" }
LC_PHANTOM = { pattern = [20.0, -3.0, 0.5, -3.0, 0.5, -3.0], description = "phantom ____ . . ____" }

[text]
basis = "GB/T 14691-1993（长仿宋体，字宽约 h/√2；字高系列）；cjk_em 与 char_width 为 ezdxf.fonts 对 simfang.ttf 的实测（单位：cap height）"
font = "simfang.ttf"
width_factor = 0.7
heights = [1.8, 2.5, 3.5, 5.0, 7.0, 10.0, 14.0, 20.0]
cjk_em = 1.463
char_width = { cjk = 1.463, other = 0.732 }  # 实测 1.4629 / 0.7314，向上取整

[dim]
basis = "箭头长：GB/T 4458.4-2003（≥ 6d）；first_row/row_pitch：DESIGN §4.6 的 GB 档默认值；其余 convention（教材：尺寸界线超出尺寸线约 2~3）"
text_height = 3.5
arrow_length = 3.0
arrow_width = 1.0
ext_beyond = 2.0
ext_gap = 0.0
text_gap = 1.0
first_row = 10.0
row_pitch = 7.0
max_rows = 6
clearance = 0.5
decimals = 3

[center]
basis = "convention（教材：点画线超出轮廓 2~5；GB/T 4457.4-2002 规定首末两端为长画）"
extend = 3.0

[note]
basis = "convention"
leader_length = 8.0
shoulder_gap = 1.0
text_height = 3.5

[hatch]
basis = "GB/T 4457.5-2013（金属材料通用剖面线：45° 细实线）；间距 convention"
pattern = "ANSI31"
angle = 45.0
spacing = 3.0

[section]
basis = "GB/T 4458.6-2002（剖切符号用粗短画，箭头表示投射方向，字母“×-×”标注剖视图名称）；数值 convention"
stroke_length = 6.0
stroke_gap = 2.0
arrow_length = 6.0
letter_height = 5.0
label_height = 5.0
label_gap = 4.0

[views]
basis = "GB/T 14692-2008（GB 用第一角画法）；GB/T 4458.1-2002（基本视图配置）；gap 为 convention"
projection = "first"
gap = 8.0
[views.positions.first]   # 相对主视图的格位 [列, 行]，行向上为正
top = [0, -1]
bottom = [0, 1]
left = [1, 0]
right = [-1, 0]
rear = [2, 0]
[views.positions.third]
top = [0, 1]
bottom = [0, -1]
left = [-1, 0]
right = [1, 0]
rear = [2, 0]

[sheets]
basis = "GB/T 14689-2008（基本幅面；留装订边：a = 25，c = 10（A0~A2）/ 5（A3、A4））"
A0 = [841.0, 1189.0]
A1 = [594.0, 841.0]
A2 = [420.0, 594.0]
A3 = [297.0, 420.0]
A4 = [210.0, 297.0]
binding = 25.0
margin = { A0 = 10.0, A1 = 10.0, A2 = 10.0, A3 = 5.0, A4 = 5.0 }

[scales]
basis = "GB/T 14690-1993"
preferred = ["1:1", "1:2", "1:5", "1:10", "2:1", "5:1", "10:1"]
allowed = ["1:1.5", "1:2.5", "1:3", "1:4", "1:6", "2.5:1", "4:1"]

[title_block]
basis = "GB/T 10609.1-2008（外形 180 × 56，位于图框右下角）；分区位置、更改区列宽、各区内的行分配和投影识别符号（GB/T 14692-2008）的比例按通行画法，未对照标准原文（未核实，见 docs/releases/v0.1.0-review.md）"
size = [180.0, 56.0]

[tech_notes]
basis = "convention"
title = "技术要求"
title_height = 5.0
height = 3.5
line_spacing = 1.6
gap = 5.0

[wavy]
basis = "convention（GB/T 4457.4-2002 波浪线为细实线、徒手绘制，未规定波形；取振幅 0.8、波长 6）"
amplitude = 0.8
wavelength = 6.0

[tolerancing]
basis = "GB/T 4458.5-2003（公差注法：偏差数字比基本尺寸数字小一号）；GB/T 1804-2000（未注公差）；GB/T 1182-2018（几何公差框格高 2h）；尺寸 convention"
general_note = "未注尺寸公差按 GB/T 1804-{cls}。"
gtol_std = "GB/T 1182-2018"
tol_height = 2.5
# D2: 引线长度补充档（convention）：GB/T 4458.4-2003 未给引线长度数值，standard 档取教材通行值，extra 为拥挤视图在档之间补充
leader_lengths_extra = [12.0, 18.0, 24.0, 34.0, 40.0]
frame_height = 7.0
leader_lengths = [6.0, 10.0, 15.0, 20.0, 28.0]

[datum]
basis = "GB/T 1182-2018（基准符号：方框内大写字母，连线与涂黑三角形）；尺寸 convention（方框边长 2h）"
box = 7.0
triangle = 3.5

[rough]
basis = "GB/T 131-2006（↔ ISO 1302:2002，新版 ISO 21920-1:2021）：h=3.5 时 H1=5、H2=10.5，符号两边与表面成 60°"
std = "GB/T 131-2006"
h1 = 5.0
h2 = 10.5

[checks]  # rule → standard number reported with each finding (SPEC M1 §7)
basis = "各规则依据的标准见各项（如 GB/T 4458.4-2003）；ISO 档覆盖为对应 ISO 标准号"
overlap = "GB/T 4458.4-2003"
out_of_frame = "GB/T 14689-2008"
view_align = "GB/T 4458.1-2002"
table_overflow = "DESIGN §4.2"
stale_op = "DESIGN §3.2"
line_width = "GB/T 4457.4-2002"
text_height = "GB/T 14691-1993"
scale = "GB/T 14690-1993"
sheet = "GB/T 14689-2008"
conv_dim = "GB/T 4459.1-1995 / 4459.3-2000 / 1095-2003 / 4458.4-2003"
section_ref = "GB/T 4458.6-2002 / 4458.1-2002"
center_mark = "GB/T 4457.4-2002"
duplicate = "GB/T 4458.4-2003"
closed_loop = "GB/T 4458.4-2003"
missing = "GB/T 4458.4-2003"
param_cover = "DESIGN §4.4"
dev_order = "GB/T 1800.1-2020"
gtol_syntax = "GB/T 1182-2018"
datum_letter = "GB/T 17851-2010"
general_tol = "GB/T 1804-2000"
chain_limit = "GB/T 5847-2004"
rough_syntax = "GB/T 131-2006 / GB/T 1031-2009"
rough_default = "GB/T 131-2006"
rough_fit = "GB/T 131-2006"
title_style_gb = "GB/T 10609.1-2008"
table_style_gb = "GB/T 14691-1993"

[placement]  # E5 D.place / A.place 指标的数值约定（企业档可覆盖；ISO 档继承）
basis = "GB/T 4458.4-2003 / GB/T 4458.2-2003 只规定画法，不给下列毫米数：排距取 [dim].row_pitch，尺寸界线超出取 [dim].ext_beyond；气球间隙、对齐容差与尺寸界线起点间隙为 convention（取本实现布局的通行值）"
balloon_clearance = 1.0
balloon_align_tol = 0.5
ext_gap_max = 1.5
row_tol = 0.05

[assembly]
basis = "convention：GB/T 4458.2-2003 未给序号圆圈直径数值，取教材通行值；圆圈最小间距 δ 与对齐容差取 [placement].balloon_clearance / balloon_align_tol（单一来源，E5 A.place 同值）"
balloon_height = 5.0
balloon_radius = 4.5
balloon_offset = 8.0  # 视图轮廓到圆圈边缘的引线长度；圆心距离为 offset + radius（convention）
