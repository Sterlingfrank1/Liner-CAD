# GB 模板 A1。GB/T 10609.1-2008 标题栏（180 × 56）。
# 坐标相对标题栏左下角。左区 80 = 更改区 / 签字区，列宽 10/10/16/16/12/16，行高 7；
# 中区 50 = 其他区（材料标记、阶段标记、重量、比例、共 张 第 张、投影符号格）；
# 右区 50 = 名称及代号区（单位名称、图样名称、图样代号）。外框粗实线，内部细实线。
# 分区位置与列宽按标准图 2；区内各格的行分配是本模板的取法（标准未逐格规定），见 HANDOVER。
# 字段名与 ISO 档统一；GB 标题栏里没有对应栏的 doc_type 放在签字区右下的空白格，不印标签。
name = "GB-A1"
sheet = "A1"
size = [841.0, 594.0]  # 宽, 高
margins = [25.0, 10.0, 10.0, 10.0]  # 内图框距图幅边：左（装订边）, 下, 右, 上

